name: Feedback or idea
description: Something is hard to use, unclear, missing, or could be better.
title: "[Feedback] "
labels: ["beta", "needs-triage", "feedback"]
body:
  - type: input
    id: version
    attributes:
      label: Babarify Frame version
      placeholder: "0.9.1"
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Hard to find or understand
        - Accessibility (keyboard, screen reader, contrast, size)
        - Missing feature
        - Something I like (keep it!)
        - Other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked that this contains nothing I want to keep private.
          required: true
